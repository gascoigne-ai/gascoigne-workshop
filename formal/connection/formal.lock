{
  "version": 1,
  "entries": [
    {
      "id": "connecting-leaves",
      "kind": "claim",
      "statement": "A connection in progress leaves Connecting once its answer arrives, and always has its answer on the way"
    },
    {
      "id": "refused-event-changes-nothing",
      "kind": "claim",
      "statement": "An event the connection refuses in its current state changes nothing"
    },
    {
      "id": "retry-only-when-asked",
      "kind": "claim",
      "statement": "A failed or dropped connection retries only when the tab asks for a reconnect, and otherwise ends idle"
    },
    {
      "id": "session-only-while-up",
      "kind": "claim",
      "statement": "A connection holds a session exactly while it is open or closing"
    },
    {
      "id": "stale-connect-not-current",
      "kind": "claim",
      "statement": "A connect the user gave up, or a newer connect replaced, is never the current one, so its late answer is dropped, and an open session is always the latest connect's"
    },
    {
      "id": "user-close-never-retries",
      "kind": "claim",
      "statement": "After the user disconnects, the connection never reconnects until the user connects again"
    }
  ],
  "decisions": []
}
